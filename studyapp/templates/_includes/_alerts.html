{% comment %} Reusable Alert Components {% endcomment %}
{% if message %}
<div class="alert alert-{{ alert_type|default:'info' }} {% if dismissible %}alert-dismissible{% endif %}">
    {% if dismissible %}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    {% endif %}
    {{ message }}
</div>
{% endif %}
