{% comment %} Reusable Button Components {% endcomment %}
{% if type == "submit" or type == "" %}
<button type="{{ type|default:'submit' }}" class="btn btn-{{ variant|default:'success' }} {% if size %}btn-{{ size }}{% endif %} {% if extra_class %}{{ extra_class }}{% endif %}">
    {{ text }}
</button>
{% elif type == "link" %}
<a href="{{ url }}" class="btn btn-{{ variant|default:'outline' }} {% if size %}btn-{{ size }}{% endif %} {% if extra_class %}{{ extra_class }}{% endif %}">
    {{ text }}
</a>
{% else %}
<button type="{{ type|default:'button' }}" class="btn btn-{{ variant|default:'secondary' }} {% if size %}btn-{{ size }}{% endif %} {% if extra_class %}{{ extra_class }}{% endif %}">
    {{ text }}
</button>
{% endif %}
