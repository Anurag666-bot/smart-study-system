{% comment %} Reusable Form Components {% endcomment %}
<div class="form-group">
    {% if label %}
        <label for="{{ field.id_for_label }}" class="form-label">{{ label|default:field.label }}</label>
    {% endif %}
    {{ field }}
    {% if field.help_text %}
        <small class="form-text text-muted">{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <div class="form-error">
            {{ field.errors|join:". " }}
        </div>
    {% endif %}
</div>
