{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}
{% block header %}{{ heading }}{% endblock %}
{% block content %}
<div class="form-container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save exam</button>
        <a href="{% url 'exam_list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
