{% extends 'base.html' %}
{% block title %}Exam Result{% endblock %}
{% block header %}Result: {{ exam.title }}{% endblock %}
{% block content %}
<div class="form-container">
    <p>Maximum score: {{ exam.max_score }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save result</button>
        <a href="{% url 'exam_list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
