{% extends 'base.html' %}
{% block title %}Edit Planner Event{% endblock %}
{% block header %}Edit Planner Event{% endblock %}
{% block content %}
<div class="form-container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update event</button>
        <a href="{% url 'planner_event_list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
