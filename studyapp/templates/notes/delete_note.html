{% extends 'base.html' %}
{% block title %}Delete Note{% endblock %}
{% block header %}🗑️ Delete Note{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Delete Note</h2>
    <p>Are you sure you want to move "<strong>{{ note.title }}</strong>" to trash?</p>
    <p>This action can be undone from the trash folder.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Move to Trash</button>
        <a href="{% url 'notes_list' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
