{% extends 'base.html' %}
{% block title %}{{ form_title }}{% endblock %}
{% block header %}{{ form_title }}{% endblock %}
{% block content %}
<div class="form-container">
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">{{ submit_label|default:'Save' }}</button>
        <a href="{% url 'planner' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
