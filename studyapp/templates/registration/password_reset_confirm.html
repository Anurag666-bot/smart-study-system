{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block header %}🔐 Set New Password{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Set a new password!</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Change My Password</button>
    </form>
</div>
{% endblock %}
