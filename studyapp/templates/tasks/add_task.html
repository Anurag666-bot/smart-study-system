{% extends 'base.html' %}
{% load static %}

{% block title %}Add Task{% endblock %}
{% block header %}➕ Add New Task{% endblock %}

{% block content %}
<form method="POST" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save Task</button>
    <a href="{% url 'task_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
