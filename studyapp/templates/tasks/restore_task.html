{% extends 'base.html' %}
{% block title %}Restore Task{% endblock %}
{% block header %}↩️ Restore Task{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Restore Task</h2>
    <p>Are you sure you want to restore "<strong>{{ task.title }}</strong>" from trash?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Restore Task</button>
        <a href="{% url 'trash_tasks' %}" class="btn btn-outline">Keep in Trash</a>
    </form>
</div>
{% endblock %}
